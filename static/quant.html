<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>📈</text></svg>">
<title>DAPENG Alpha · 量化回测</title>
<script src="js/echarts.min.js?v=5"></script>
<meta name="theme-color" content="#03060f">
<style>
:root{
  --bg:#03060f;--bg2:#0a0f1e;--text:#e2e8f0;--text2:#94a3b8;--muted:#64748b;
  --cyan:#06b6d4;--green:#00e96a;--red:#ff3d6a;--gold:#f59e0b;--blue:#3b82f6;
  --purple:#a855f7;--pink:#ec4899;
  --card-bg:rgba(15,23,42,0.6);--card-bg2:rgba(15,23,42,0.4);
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);
  --font-mono:'Fira Code','Consolas','Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.5;overflow:hidden}
a{text-decoration:none}

/* ===== Topbar ===== */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:48px;background:rgba(0,0,0,0.5);border-bottom:1px solid var(--border);flex-shrink:0;z-index:100;backdrop-filter:blur(12px)}
#topbar .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:0.02em}
#topbar .logo .icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-size:13px}
#topbar .logo .sep{color:var(--muted);font-weight:400;margin:0 4px}
#topbar .logo .sub{color:var(--blue);font-size:13px;font-weight:600}
.nav-links{display:flex;gap:6px;align-items:center}
.nav-link{font-size:12px;color:var(--text2);padding:5px 12px;border-radius:6px;border:1px solid var(--border);transition:all .15s;cursor:pointer;display:flex;align-items:center;gap:4px}
.nav-link:hover{border-color:var(--blue);color:var(--blue);background:rgba(59,130,246,0.06)}
.nav-link.active{background:rgba(59,130,246,0.12);border-color:rgba(59,130,246,0.3);color:var(--blue)}

/* 从仪表盘带上下文进来时的说明条 */
.ctx-chip{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text2);
  padding:4px 10px;border-radius:999px;border:1px solid rgba(214,176,132,0.28);
  background:rgba(214,176,132,0.08);max-width:520px;overflow:hidden;white-space:nowrap}
.ctx-chip b{color:var(--gold);font-weight:700}
.ctx-chip .ctx-sub{color:var(--muted);font-size:10px}
.ctx-chip a{color:var(--gold);text-decoration:none;border-bottom:1px dotted rgba(214,176,132,0.5)}
.ctx-chip a:hover{color:var(--cyan);border-color:var(--cyan)}
@media (max-width:1100px){.ctx-chip{display:none}}

#status-bar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2)}
#progress-bar-wrap{width:180px;height:5px;background:rgba(255,255,255,0.04);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
#progress-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:3px;transition:width .4s ease;box-shadow:0 0 8px rgba(59,130,246,0.4)}
#progress-text{min-width:32px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text2);font-size:11px;font-family:var(--font-mono)}
#status-indicator{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:16px;background:var(--card-bg2);border:1px solid var(--border);font-weight:500;font-size:11px;transition:all .2s}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:all .2s}
.dot.idle{background:var(--muted)}
.dot.running{background:var(--blue);animation:pulse 1.2s infinite;box-shadow:0 0 6px var(--blue)}
.dot.done{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.error{background:var(--red);box-shadow:0 0 6px var(--red)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

/* ===== Layout ===== */
#layout{display:flex;height:calc(100vh - 48px);overflow:hidden}

/* ===== Left Panel ===== */
#left-panel{width:290px;flex-shrink:0;background:rgba(0,0,0,0.2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#left-panel-inner{flex:1;overflow-y:auto;padding:14px}
#left-panel-inner::-webkit-scrollbar{width:3px}
#left-panel-inner::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:2px}

.panel-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
.panel-title::before{content:'';width:3px;height:12px;background:var(--blue);border-radius:2px}

.form-section{margin-bottom:18px}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:4px}
.form-group{margin-bottom:11px}
.form-group label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text2);margin-bottom:5px}
.form-group label .val{color:var(--blue);font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:11px}

input[type="text"],input[type="password"],input[type="date"],input[type="number"]{
  width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;font-size:12px;outline:none;transition:all .15s;font-family:inherit}
input[type="text"]:focus,input[type="password"]:focus,input[type="date"]:focus,input[type="number"]:focus{border-color:var(--blue);background:rgba(59,130,246,0.04);box-shadow:0 0 0 2px rgba(59,130,246,0.08)}
input[type="text"]::placeholder,input[type="password"]::placeholder{color:var(--muted)}

input[type="range"]{width:100%;-webkit-appearance:none;height:3px;border-radius:2px;background:rgba(255,255,255,0.08);outline:none;cursor:pointer}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--blue);cursor:pointer;border:2px solid var(--bg);box-shadow:0 0 6px rgba(59,130,246,0.5);transition:transform .1s}
input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.2)}
input[type="range"]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--blue);cursor:pointer;border:2px solid var(--bg)}

.input-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.divider{height:1px;background:var(--border);margin:6px 0 14px}

.btn{display:block;width:100%;padding:9px 14px;border:none;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:0.02em;transition:all .15s;outline:none;font-family:inherit}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-run{background:linear-gradient(135deg,#1a6f3c,#238636);color:#fff;margin-bottom:7px;border:1px solid rgba(63,185,80,0.3)}
.btn-run:hover:not(:disabled){background:linear-gradient(135deg,#238636,#2ea043);box-shadow:0 4px 16px rgba(63,185,80,0.3);transform:translateY(-1px)}
.btn-stop{background:rgba(255,61,106,0.06);color:var(--red);border:1px solid rgba(255,61,106,0.3)}
.btn-stop:hover:not(:disabled){background:rgba(255,61,106,0.12)}

/* ===== Main Panel ===== */
#main-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px;gap:12px}

#metric-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex-shrink:0}
.metric-card{background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;transition:all .2s;position:relative;overflow:hidden}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:.6}
.metric-card.nav-card::before{background:linear-gradient(90deg,var(--blue),var(--cyan))}
.metric-card.sharpe-card::before{background:linear-gradient(90deg,var(--green),var(--cyan))}
.metric-card.dd-card::before{background:linear-gradient(90deg,var(--red),var(--gold))}
.metric-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.metric-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted)}
.metric-value{font-size:26px;font-weight:800;font-family:var(--font-mono);font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-0.02em}
.metric-sub{font-size:10px;color:var(--muted);margin-top:1px}
.metric-value.positive{color:var(--green)}
.metric-value.negative{color:var(--red)}
.metric-value.neutral{color:var(--blue)}

#chart-wrap{flex:1;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;position:relative;min-height:0;overflow:hidden}
#chart-main{width:100%;height:100%}
#chart-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:14px;pointer-events:none}
#chart-placeholder .ph-icon{width:56px;height:56px;opacity:.15}
#chart-placeholder p{font-size:13px;letter-spacing:0.04em}
#chart-placeholder .ph-hint{font-size:11px;color:var(--muted);opacity:.6}

/* ===== Log Panel ===== */
#log-panel{width:300px;flex-shrink:0;background:rgba(0,0,0,0.2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#log-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.log-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);display:flex;align-items:center;gap:6px}
.log-title::before{content:'';width:3px;height:11px;background:var(--purple);border-radius:2px}
#sse-status{display:inline-flex;align-items:center;gap:3px;font-size:9px;padding:2px 6px;border-radius:8px;font-weight:700;letter-spacing:0.03em}
#sse-status.connected{background:rgba(0,233,106,0.12);color:var(--green);border:1px solid rgba(0,233,106,0.2)}
#sse-status.disconnected{background:rgba(100,116,139,0.12);color:var(--muted);border:1px solid var(--border)}
#sse-status.error{background:rgba(255,61,106,0.12);color:var(--red);border:1px solid rgba(255,61,106,0.2)}
#btn-clear-log{padding:3px 9px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--text2);font-size:10px;cursor:pointer;transition:all .15s;font-family:inherit}
#btn-clear-log:hover{border-color:var(--blue);color:var(--blue);background:rgba(59,130,246,0.04)}
#log-body{flex:1;overflow-y:auto;padding:8px;font-family:var(--font-mono);font-size:11px;line-height:1.65;background:var(--bg)}
#log-body::-webkit-scrollbar{width:3px}
#log-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:2px}
.log-line{display:block;word-break:break-all;padding:1px 0;color:var(--text2)}
.log-line.log-warn{color:var(--gold)}
.log-line.log-model{color:var(--blue)}
.log-line.log-progress{color:var(--green)}
.log-line.log-error{color:var(--red)}
.log-line.log-info{color:var(--purple)}
.log-line.log-done{color:var(--green);font-weight:700}
.log-line.log-step{color:var(--cyan)}

/* ===== Responsive ===== */
@media(max-width:1200px){
  #log-panel{width:260px}
  #left-panel{width:260px}
}
@media(max-width:900px){
  #layout{flex-direction:column}
  #left-panel,#log-panel{width:100%;height:auto;max-height:200px}
  #metric-cards{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ═══ Topbar ═══ -->
<div id="topbar">
  <div class="logo">
    <span class="icon">A</span>
    DAPENG Alpha
    <span class="sep">|</span>
    <span class="sub">量化回测引擎</span>
  </div>
  <div class="nav-links">
    <a href="/dashboard.html" class="nav-link">📊 策略选股</a>
    <a href="/quant.html" class="nav-link active">🔬 量化回测</a>
    <a href="/dashboard.html#market" class="nav-link">📈 市场情绪</a>
    <a href="/project-docs.html" class="nav-link">📖 项目文档</a>
    <a href="/api-reference.html" class="nav-link">🔌 接口</a>
    <a href="/index.html" class="nav-link">🏠 首页</a>
    <a href="/admin.html" class="nav-link">⚙ 后台</a>
  </div>
  <!-- 从仪表盘带 ?code= / ?sector= 进来时，说明「这次回测的上下文」；
       回测本身是股票池模式，不针对单只股票，所以这里只做说明与回跳，不假装预填标的。 -->
  <div id="ctx-chip" class="ctx-chip" hidden></div>
  <div id="status-bar">
    <div id="progress-bar-wrap"><div id="progress-bar-fill"></div></div>
    <span id="progress-text">0%</span>
    <div id="status-indicator">
      <div class="dot idle" id="status-dot"></div>
      <span id="status-text">等待</span>
    </div>
  </div>
</div>

<!-- ═══ Layout ═══ -->
<div id="layout">

  <!-- ── Left: Config ── -->
  <div id="left-panel">
    <div id="left-panel-inner">
      <div class="panel-title">策略配置</div>

      <div class="form-section">
        <div class="section-label">🔑 API 凭证</div>
        <div class="form-group">
          <input type="password" id="cfg-token" placeholder="粘贴 Tushare Token" autocomplete="off" />
        </div>
      </div>
      <div class="divider"></div>

      <div class="form-section">
        <div class="section-label">📅 回测区间</div>
        <div class="input-row">
          <div class="form-group">
            <label>开始</label>
            <input type="date" id="cfg-start" value="2018-01-01" />
          </div>
          <div class="form-group">
            <label>结束</label>
            <input type="date" id="cfg-end" placeholder="留空=今天" />
          </div>
        </div>
      </div>
      <div class="divider"></div>

      <div class="form-section">
        <div class="section-label">💎 股票池过滤</div>
        <div class="form-group">
          <label>价格区间 <span class="val"><span id="val-price-low">5</span> ~ <span id="val-price-high">36</span></span></label>
          <div class="input-row">
            <input type="number" id="cfg-price-low" value="5" min="0" max="100" step="0.5" />
            <input type="number" id="cfg-price-high" value="36" min="0" max="200" step="0.5" />
          </div>
        </div>
        <div class="form-group">
          <label>最大股票数 <span class="val" id="val-max-stocks">80</span></label>
          <input type="range" id="cfg-max-stocks" min="10" max="200" step="10" value="80" oninput="syncVal('val-max-stocks',this.value)" />
        </div>
      </div>
      <div class="divider"></div>

      <div class="form-section">
        <div class="section-label">⚙️ 策略参数</div>
        <div class="form-group">
          <label>预测周期 HORIZON <span class="val" id="val-horizon">10</span></label>
          <input type="range" id="cfg-horizon" min="3" max="30" step="1" value="10" oninput="syncVal('val-horizon',this.value)" />
        </div>
        <div class="form-group">
          <label>选股数量 TOPK <span class="val" id="val-topk">5</span></label>
          <input type="range" id="cfg-topk" min="1" max="20" step="1" value="5" oninput="syncVal('val-topk',this.value)" />
        </div>
        <div class="form-group">
          <label>最低概率 MIN_PROBA <span class="val" id="val-min-proba">0.55</span></label>
          <input type="range" id="cfg-min-proba" min="0.50" max="0.90" step="0.01" value="0.55" oninput="syncVal('val-min-proba',parseFloat(this.value).toFixed(2))" />
        </div>
        <div class="form-group">
          <label>风险阈值 THETA <span class="val" id="val-theta">0.10</span></label>
          <input type="range" id="cfg-theta" min="0.00" max="0.30" step="0.01" value="0.10" oninput="syncVal('val-theta',parseFloat(this.value).toFixed(2))" />
        </div>
        <div class="form-group">
          <label>交易成本 TCOST <span class="val" id="val-tcost">0.001</span></label>
          <input type="range" id="cfg-tcost" min="0.000" max="0.005" step="0.0005" value="0.001" oninput="syncVal('val-tcost',parseFloat(this.value).toFixed(4))" />
        </div>
      </div>
      <div class="divider"></div>

      <div class="form-section">
        <div class="section-label">🔄 Walk-Forward</div>
        <div class="form-group">
          <label>最少训练年数 <span class="val" id="val-train-years">3</span></label>
          <input type="range" id="cfg-train-years" min="1" max="5" step="1" value="3" oninput="syncVal('val-train-years',this.value)" />
        </div>
        <div class="form-group">
          <label>重训练间隔(天) <span class="val" id="val-step-days">20</span></label>
          <input type="range" id="cfg-step-days" min="5" max="60" step="5" value="20" oninput="syncVal('val-step-days',this.value)" />
        </div>
      </div>
    </div>
    <div style="padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0">
      <button class="btn btn-run" id="btn-run" onclick="handleRun()">▶ 启动回测</button>
      <button class="btn btn-stop" id="btn-stop" onclick="handleStop()" disabled>■ 停止</button>
    </div>
  </div>

  <!-- ── Center: Metrics + Chart ── -->
  <div id="main-panel">
    <div id="metric-cards">
      <div class="metric-card nav-card">
        <div class="metric-label">最终净值</div>
        <div class="metric-value neutral" id="metric-nav">—</div>
        <div class="metric-sub">策略累计收益率</div>
      </div>
      <div class="metric-card sharpe-card">
        <div class="metric-label">年化夏普比率</div>
        <div class="metric-value neutral" id="metric-sharpe">—</div>
        <div class="metric-sub">风险调整后收益</div>
      </div>
      <div class="metric-card dd-card">
        <div class="metric-label">最大回撤</div>
        <div class="metric-value neutral" id="metric-dd">—</div>
        <div class="metric-sub">历史最大峰谷跌幅</div>
      </div>
    </div>
    <div id="chart-wrap">
      <div id="chart-main"></div>
      <div id="chart-placeholder">
        <svg class="ph-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M3 3v18h18"/><polyline points="7 16 11 9 14 12 19 5"/>
        </svg>
        <p>启动回测后，净值曲线将在此显示</p>
        <p class="ph-hint">配置左侧参数 → 点击「启动回测」</p>
      </div>
    </div>
  </div>

  <!-- ── Right: Logs ── -->
  <div id="log-panel">
    <div id="log-header">
      <div class="log-title">实时日志 <span id="sse-status" class="disconnected">● 未连接</span></div>
      <button id="btn-clear-log" onclick="clearLogs()">清空</button>
    </div>
    <div id="log-body"></div>
  </div>

</div>

<script>
// ─────── State ───────
let currentTaskId=null, sseSource=null, pollTimer=null, chartInstance=null, isRunning=false;

// ─────── 跨页上下文 ───────
// 仪表盘的「量化回测」入口会带 ?code=&sector= 过来。回测本身是「股票池」模式
// （价格区间 + 最大股票数 + Walk-Forward），不针对单只股票，所以这里不预填标的，
// 只把来源上下文显式说明出来 + 给一条回跳路径，避免用户以为「点了却没反应」。
(function initCtxChip(){
  var qs;
  try { qs = new URLSearchParams(location.search); } catch(e){ return; }
  var code=(qs.get('code')||'').trim(), sector=(qs.get('sector')||'').trim();
  if(!code && !sector) return;
  var el=document.getElementById('ctx-chip');
  if(!el) return;
  var back='/dashboard.html'+((code||sector)?('?'+(code?('code='+encodeURIComponent(code)):('sector='+encodeURIComponent(sector)))):'');
  el.innerHTML='<span class="ctx-sub">来源</span>'
    +'<b>'+ (code? code : sector) +'</b>'
    +'<span class="ctx-sub">· 回测为全市场股票池模式，不针对单只标的</span>'
    +'<a href="'+back+'">回策略看板 →</a>';
  el.hidden=false;
})();

// ─────── Utils ───────
function syncVal(id,v){document.getElementById(id).textContent=v}
function setStatus(s){
  const d=document.getElementById('status-dot'),t=document.getElementById('status-text');
  const labels={idle:'等待',running:'运行中',done:'已完成',error:'错误'};
  d.className='dot '+s; t.textContent=labels[s]||s;
}
function setProgress(p){
  p=Math.min(100,Math.max(0,p));
  document.getElementById('progress-bar-fill').style.width=p+'%';
  document.getElementById('progress-text').textContent=p+'%';
}
function classifyLog(m){
  if(/\[WARN\]/i.test(m))return'log-warn';
  if(/\[MODEL\]/i.test(m))return'log-model';
  if(/\[PROGRESS/i.test(m))return'log-progress';
  if(/\[ERROR\]/i.test(m))return'log-error';
  if(/\[INFO\]/i.test(m))return'log-info';
  if(/\[DONE\]/i.test(m))return'log-done';
  if(/\[STEP/i.test(m))return'log-step';
  if(/回测完成|=+/i.test(m))return'log-done';
  return'';
}
function appendLog(msg){
  const body=document.getElementById('log-body');
  const span=document.createElement('span');
  span.className='log-line '+classifyLog(msg);
  span.textContent=msg;
  body.appendChild(span);
  body.appendChild(document.createTextNode('\n'));
  body.scrollTop=body.scrollHeight;
}
function clearLogs(){document.getElementById('log-body').innerHTML=''}
function setSseStatus(s){
  const el=document.getElementById('sse-status');
  el.className=s;
  el.textContent={connected:'● 已连接',disconnected:'● 未连接',error:'● 断开'}[s]||s;
}

// ─────── Config ───────
function collectConfig(){
  const g=id=>document.getElementById(id);
  const endVal=g('cfg-end').value.trim();
  return{
    TUSHARE_TOKEN:g('cfg-token').value.trim(),
    START:g('cfg-start').value,
    END:endVal||null,
    PRICE_LOW:parseFloat(g('cfg-price-low').value),
    PRICE_HIGH:parseFloat(g('cfg-price-high').value),
    MAX_STOCKS:parseInt(g('cfg-max-stocks').value),
    HORIZON:parseInt(g('cfg-horizon').value),
    TOPK:parseInt(g('cfg-topk').value),
    MIN_PROBA:parseFloat(g('cfg-min-proba').value),
    THETA_THRESHOLD:parseFloat(g('cfg-theta').value),
    TCOST:parseFloat(g('cfg-tcost').value),
    TRAIN_MIN_YEARS:parseInt(g('cfg-train-years').value),
    STEP_DAYS:parseInt(g('cfg-step-days').value),
    INDEX_CODES:["000300.SH","000905.SH"],
    BUY_TH:0.02,SELL_TH:-0.02,SEED:42,
  };
}

async function loadConfig(){
  try{
    const r=await fetch('/api/quant/config');
    if(!r.ok)return;
    const c=await r.json();
    const set=(id,v)=>{const e=document.getElementById(id);if(e&&v!==undefined&&v!==null)e.value=v};
    set('cfg-token',c.TUSHARE_TOKEN);
    set('cfg-start',c.START);
    set('cfg-end',c.END||'');
    set('cfg-price-low',c.PRICE_LOW);
    set('cfg-price-high',c.PRICE_HIGH);
    set('cfg-max-stocks',c.MAX_STOCKS);
    set('cfg-horizon',c.HORIZON);
    set('cfg-topk',c.TOPK);
    set('cfg-min-proba',c.MIN_PROBA);
    set('cfg-theta',c.THETA_THRESHOLD);
    set('cfg-tcost',c.TCOST);
    set('cfg-train-years',c.TRAIN_MIN_YEARS);
    set('cfg-step-days',c.STEP_DAYS);
    syncVal('val-price-low',c.PRICE_LOW);
    syncVal('val-price-high',c.PRICE_HIGH);
    syncVal('val-max-stocks',c.MAX_STOCKS);
    syncVal('val-horizon',c.HORIZON);
    syncVal('val-topk',c.TOPK);
    syncVal('val-min-proba',parseFloat(c.MIN_PROBA).toFixed(2));
    syncVal('val-theta',parseFloat(c.THETA_THRESHOLD).toFixed(2));
    syncVal('val-tcost',parseFloat(c.TCOST).toFixed(4));
    syncVal('val-train-years',c.TRAIN_MIN_YEARS);
    syncVal('val-step-days',c.STEP_DAYS);
  }catch(e){console.warn('loadConfig:',e)}
}

// ─────── Run ───────
async function handleRun(){
  if(isRunning)return;
  const cfg=collectConfig();
  if(!cfg.TUSHARE_TOKEN){alert('请先填写 Tushare Token！');return}
  clearLogs();resetMetricCards();setStatus('running');setProgress(0);
  document.getElementById('chart-placeholder').style.display='flex';
  isRunning=true;
  document.getElementById('btn-run').disabled=true;
  document.getElementById('btn-stop').disabled=false;
  try{
    const r=await fetch('/api/quant/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    currentTaskId=d.task_id;
    appendLog('[INFO] 任务已启动，task_id: '+currentTaskId);
    connectSSE(currentTaskId);
    startPolling(currentTaskId);
  }catch(err){
    appendLog('[ERROR] 启动失败: '+err.message);
    setStatus('error');resetRunButton();
  }
}

function handleStop(){
  stopPolling();closeSse();
  appendLog('[WARN] 用户请求停止 — 后台线程仍在运行直至完成。');
  setStatus('idle');setProgress(0);resetRunButton();
}

// ─────── SSE ───────
function connectSSE(taskId){
  closeSse();
  sseSource=new EventSource('/api/quant/logs/'+taskId);
  sseSource.onopen=()=>setSseStatus('connected');
  sseSource.onmessage=e=>{
    try{
      const p=JSON.parse(e.data);
      if(p.msg!==undefined){
        appendLog(p.msg);
        const m=/\[PROGRESS:(\d+)\]/.exec(p.msg);
        if(m)setProgress(parseInt(m[1]));
      }
    }catch(_){appendLog(e.data)}
  };
  sseSource.addEventListener('done',e=>{
    try{
      const p=JSON.parse(e.data);
      if(p.status==='completed')onTaskCompleted(taskId);
      else if(p.status==='error')onTaskError();
    }catch(_){}
    closeSse();
  });
  sseSource.onerror=()=>{setSseStatus('error');closeSse()};
}
function closeSse(){if(sseSource){sseSource.close();sseSource=null;setSseStatus('disconnected')}}

// ─────── Polling ───────
function startPolling(taskId){
  stopPolling();
  pollTimer=setInterval(async()=>{
    try{
      const r=await fetch('/api/quant/status/'+taskId);
      if(!r.ok)return;
      const d=await r.json();
      setProgress(d.progress||0);
      if(d.status==='completed'){stopPolling();onTaskCompleted(taskId)}
      else if(d.status==='error'){stopPolling();onTaskError(d.error)}
    }catch(_){}
  },2000);
}
function stopPolling(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}

// ─────── Complete ───────
async function onTaskCompleted(taskId){
  setStatus('done');setProgress(100);
  appendLog('[DONE] 回测完成，正在渲染结果...');
  try{
    const r=await fetch('/api/quant/result/'+taskId);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const result=await r.json();
    renderResult(result);
    appendLog('[DONE] 图表已渲染完成');
  }catch(err){
    appendLog('[ERROR] 获取结果失败: '+err.message);
    setStatus('error');
  }
  resetRunButton();
}
function onTaskError(msg){
  setStatus('error');
  if(msg)appendLog('[ERROR] '+msg);
  resetRunButton();
}
function resetRunButton(){
  isRunning=false;
  document.getElementById('btn-run').disabled=false;
  document.getElementById('btn-stop').disabled=true;
}

// ─────── Render ───────
function renderResult(result){
  const nav=result.final_nav, sharpe=result.sharpe, maxdd=result.max_dd;
  const equity=result.equity_curve||[], dates=result.dates||[];

  const navEl=document.getElementById('metric-nav');
  const sharpeEl=document.getElementById('metric-sharpe');
  const ddEl=document.getElementById('metric-dd');

  navEl.textContent=nav!==undefined?nav.toFixed(4):'—';
  navEl.className='metric-value '+(nav>=1?'positive':'negative');

  sharpeEl.textContent=sharpe!==undefined?sharpe.toFixed(3):'—';
  sharpeEl.className='metric-value '+(sharpe>=1?'positive':sharpe>=0?'neutral':'negative');

  ddEl.textContent=maxdd!==undefined?(maxdd*100).toFixed(2)+'%':'—';
  ddEl.className='metric-value negative';

  renderChart(dates,equity);
}

function resetMetricCards(){
  ['metric-nav','metric-sharpe','metric-dd'].forEach(id=>{
    const e=document.getElementById(id);
    e.textContent='—';e.className='metric-value neutral';
  });
}

// ─────── ECharts ───────
function renderChart(dates,equity){
  document.getElementById('chart-placeholder').style.display='none';
  const dom=document.getElementById('chart-main');
  if(!chartInstance)chartInstance=echarts.init(dom);
  const baseline=dates.map(()=>1.0);

  const option={
    backgroundColor:'transparent',
    tooltip:{
      trigger:'axis',
      axisPointer:{type:'cross',label:{backgroundColor:'#1e293b'}},
      backgroundColor:'rgba(6,12,28,0.96)',
      borderColor:'rgba(59,130,246,0.3)',
      borderWidth:1,
      textStyle:{color:'#e2e8f0',fontFamily:'Fira Code, monospace',fontSize:11},
      formatter(p){
        let out='<div style="margin-bottom:4px;color:#64748b;font-size:10px">'+p[0].axisValue+'</div>';
        p.forEach(x=>{
          const v=typeof x.value==='number'?x.value.toFixed(4):x.value;
          out+='<div style="display:flex;justify-content:space-between;gap:14px"><span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+x.color+';margin-right:4px"></span>'+x.seriesName+'</span><span style="font-weight:700;color:'+x.color+'">'+v+'</span></div>';
        });
        return out;
      }
    },
    legend:{data:['策略净值','基准(1.0)'],top:6,right:10,textStyle:{color:'#64748b',fontSize:11},icon:'roundRect',itemWidth:12,itemHeight:3},
    grid:{left:55,right:15,top:40,bottom:50},
    xAxis:{
      type:'category',data:dates,
      axisLine:{lineStyle:{color:'rgba(255,255,255,0.06)'}},
      axisTick:{show:false},
      axisLabel:{color:'#475569',fontSize:10,rotate:30,formatter:v=>v?v.slice(0,7):'',interval:Math.max(1,Math.floor(dates.length/10))},
      splitLine:{show:false}
    },
    yAxis:{
      type:'value',
      axisLine:{show:false},
      axisTick:{show:false},
      axisLabel:{color:'#475569',fontSize:10,formatter:v=>v.toFixed(2)},
      splitLine:{lineStyle:{color:'rgba(255,255,255,0.03)',type:'dashed'}}
    },
    dataZoom:[
      {type:'inside',start:0,end:100},
      {type:'slider',height:18,bottom:6,borderColor:'rgba(255,255,255,0.06)',textStyle:{color:'#475569',fontSize:9},fillerColor:'rgba(59,130,246,0.06)',handleStyle:{color:'#3b82f6',borderColor:'#3b82f6'},moveHandleStyle:{color:'#3b82f6'},selectedDataBackground:{lineStyle:{color:'#3b82f6'},areaStyle:{color:'#3b82f6',opacity:0.08}}}
    ],
    series:[
      {
        name:'策略净值',type:'line',data:equity,smooth:true,symbol:'none',
        lineStyle:{color:'#3b82f6',width:2,shadowColor:'rgba(59,130,246,0.3)',shadowBlur:8},
        areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(59,130,246,0.25)'},{offset:1,color:'rgba(59,130,246,0.01)'}])},
        markLine:{silent:true,symbol:'none',data:[{yAxis:1.0}],lineStyle:{color:'#475569',type:'dashed',width:1},label:{show:false}}
      },
      {
        name:'基准(1.0)',type:'line',data:baseline,smooth:false,symbol:'none',
        lineStyle:{color:'#475569',width:1,type:'dashed'},areaStyle:{opacity:0}
      }
    ]
  };
  chartInstance.setOption(option,true);
}

window.addEventListener('resize',()=>{if(chartInstance)chartInstance.resize()});

// ─────── Sync price inputs ───────
document.getElementById('cfg-price-low').addEventListener('input',function(){syncVal('val-price-low',this.value)});
document.getElementById('cfg-price-high').addEventListener('input',function(){syncVal('val-price-high',this.value)});

// ─────── Init ───────
(async function init(){
  await loadConfig();
  setStatus('idle');
  setSseStatus('disconnected');
  setProgress(0);
})();
</script>
