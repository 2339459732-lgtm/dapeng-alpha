<!DOCTYPE html>

<body class="lr-body">
<div class="lr-wrap">

  <!-- ============ 顶栏 ============ -->
  <header class="lr-top">
    <div class="lr-brand"><b>龙虎榜复盘</b><span>LHB REVIEW</span></div>

  <div id="lr-alert" hidden></div>

  <!-- ============ 主体 ============ -->
  <main id="lr-main">
    <div class="lr-skeleton" id="lr-skeleton">
      <div class="lr-sk-line" style="width:62%"></div>
