name: Bug 报告
description: 报告可复现的故障（请不要粘贴私钥、持仓或账户信息）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请确认：
        - 已搜索过现有 issue；
        - **不要**粘贴 `ACCESS_KEY`、`.env` 内容、真实持仓或用户数据；
        - 涉及安全漏洞请走 `SECURITY.md` 的私下渠道。
  - type: input
    id: version
    attributes:
      label: 版本/提交
      description: `git rev-parse --short HEAD` 的输出
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 数据接入（行情/覆盖/扫描）
        - 研判链路 / 候选池
        - 面板展示
        - 访问控制 / 登录
        - 部署 / 启动
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动：python -m uvicorn server.main:app --port 8900
        2. 打开 /dashboard.html
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志（已脱敏）
      description: 只贴报错行，注意去掉路径、IP、密钥
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已移除私钥、账户与持仓等敏感信息
          required: true
